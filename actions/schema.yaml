ref: netbox.schema
label: "Get NetBox OpenAPI Schema"
description: "Read the current instance OpenAPI schema as structured JSON"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: netbox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.netbox.credentials, required: true, description: "Pack-owned encrypted Key with canonical ref pack.netbox.*"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 60}
output:
  operation: {type: string}
  resource: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [netbox, openapi, schema, read]
