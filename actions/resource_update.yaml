ref: netbox.resource_update
label: "Update Curated NetBox Resource"
description: "Patch one object by numeric ID with optimistic concurrency when NetBox advertises ETags"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: netbox_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: netbox.credentials, required: true, description: "Pack-owned encrypted netbox.* credential Key ref"}
  resource: {type: string, required: true, enum: [regions, sites, tenants, racks, manufacturers, device_types, platforms, device_roles, devices, device_interfaces, cables, prefixes, ip_addresses, vlans, vrfs, providers, circuits, circuit_terminations, clusters, virtual_machines, vm_interfaces, tags, custom_fields, journal_entries]}
  object_id: {type: integer, minimum: 1, required: true, description: "Numeric NetBox primary key, never a name"}
  body: {type: object, required: true, description: "Partial PATCH representation; custom_fields is preserved as an object"}
  if_match: {type: string, description: "Exact ETag from resource_get; omitted to fetch the current ETag before PATCH"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  resource: {type: any}
  data: {type: any}
  meta: {type: object}
tags: [netbox, resource, update, write, etag]
